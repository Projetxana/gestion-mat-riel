name: BuildTrack Security Tests
on:
  push:
    branches:
      - feature/collective-hours-progress
  pull_request:
    branches:
      - hotfix/admin-production

permissions:
  contents: read

jobs:
  tenant-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/collective-hours.test.mjs tests/tenant-rls.test.mjs
      - run: npm run build
