name: BuildTrack Security Tests
on:
  push:
    branches:
      - feature/collective-hours-progress
  pull_request:
    branches:
      - hotfix/admin-production

permissions:
  contents: read

jobs:
  tenant-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: buildtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: PostgreSQL 17 RLS fixture (isolated)
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d buildtrack_test -v ON_ERROR_STOP=1 -f tests/tenant-rls-postgres.sql
      - name: Purchases RLS and order importer fixture (PostgreSQL 17 isolated)
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE buildtrack_purchases_release_test"
          psql -h 127.0.0.1 -U postgres -d buildtrack_purchases_release_test -v ON_ERROR_STOP=1 -f tests/purchases-rls-postgres.sql
      - name: Purchase line mapping RLS tests in disposable PostgreSQL 17
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE buildtrack_purchase_reconciliation_test"
          psql -h 127.0.0.1 -U postgres -d buildtrack_purchase_reconciliation_test -v ON_ERROR_STOP=1 -f tests/purchases-reconciliation-postgres.sql
      - name: Manual startup hours RLS and tenant isolation (PostgreSQL 17)
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE buildtrack_startup_hours_test"
          psql -h 127.0.0.1 -U postgres -d buildtrack_startup_hours_test -v ON_ERROR_STOP=1 -f tests/manual-startup-hours-postgres.sql
      - name: Budget replacement and extension history (PostgreSQL 17 isolated)
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE buildtrack_budget_revisions_test"
          psql -h 127.0.0.1 -U postgres -d buildtrack_budget_revisions_test -v ON_ERROR_STOP=1 -f tests/purchases-budget-revisions-postgres.sql
      - name: Push reminder RLS and scheduling (isolated PostgreSQL 17)
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE buildtrack_push_test"
          psql -h 127.0.0.1 -U postgres -d buildtrack_push_test -v ON_ERROR_STOP=1 -f tests/push-reminders-postgres.sql
      - name: Validate operator backup script syntax
        run: bash -n scripts/backup-buildtrack-prod.sh
      - name: Recovery drill (local fabricated database only)
        env:
          PGPASSWORD: fixture-only
        run: bash tests/tenant-recovery-fixture.sh
      - run: node --test tests/collective-hours.test.mjs tests/tenant-rls.test.mjs
      - run: npm run build
        env:
          VITE_BUILDTRACK_PUSH_ENABLED: 'true'
