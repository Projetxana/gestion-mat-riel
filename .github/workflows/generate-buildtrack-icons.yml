name: Generate BuildTrack App Icons

on:
  push:
    branches:
      - fix/buildtrack-ios-icons-20261119
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Generate real PNG and ICO icons
        run: python scripts/generate-brand-icons.py
      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apple-touch-icon.png public/logo192.png public/logo512.png public/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "fix(pwa): replace legacy icons with BuildTrack branding"
            git push
          fi
